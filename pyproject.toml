[project]
name = "midojo"
version = "0.1.0"
description = "Man-in-the-middle red teaming for AI agents"
requires-python = ">= 3.12"
dependencies = [
    "pydantic>=2.7.1",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "fastmcp",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "a2a-sdk>=1.0",
    "protobuf>=5.29",
    "rich>=13.0",
]

[project.optional-dependencies]
# Dependencies for running the bundled suites' example agents (a2a, ogx, ...).
suites = [
    "ogx>=0.8.0,<0.9.0",
    "ogx-client>=0.8.0,<0.9.0",
    "faiss-cpu",
    "chardet",
    "pypdf",
    "openai>=1.0",
]
shell = [
    # OpenShell SDK for the `openshell` backend/protocol. Prebuilt wheels are
    # published to the index, so no Rust toolchain or local checkout is needed.
    "openshell>=0.0.105",
    "grpcio>=1.60",
    # OpenShell's generated protobuf code targets the 6.31.x runtime; the base
    # `protobuf>=5.29` pin is too old for it, so tighten it when installing shell.
    "protobuf>=6.31.1",
]
# The LangChain agent + its native LangGraph server. Targets LangChain 1.x:
# `create_agent` returns a LangGraph graph, served over HTTP by `langgraph dev`
# (in-memory Agent Server) and driven from the orchestrator via `langgraph-sdk`.
langchain = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph-cli[inmem]>=0.2",
    "langgraph-sdk>=0.1",
]
dev = [
    "pytest>=8.0.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.3.0",
    "pyright>=1.1.362",
    "python-dotenv[cli]>=1.0.0",
]

[project.scripts]
midojo-serve = "midojo.serve:main"
midojo-run = "midojo.orchestrator:main"
weather-fake-mcp-serve = "suites.weather.a2a_agent.fake_mcp:main"
weather-real-mcp-serve = "suites.weather.a2a_agent.real_mcp:main"
weather-a2a-agent = "suites.weather.a2a_agent.agent:main"
minibank-fake-mcp-serve = "suites.minibank.a2a_agent.fake_mcp:main"
minibank-real-mcp-serve = "suites.minibank.a2a_agent.real_mcp:main"
minibank-a2a-agent = "suites.minibank.a2a_agent.agent:main"
weather-langchain-agent = "suites.weather.langchain_agent.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midojo", "suites"]

[tool.uv]
managed = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "UP", "I", "ERA", "N", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
