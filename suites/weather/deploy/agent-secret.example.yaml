# LLM credentials for the LangChain/LangGraph agent. DO NOT commit real values —
# copy this, fill it in, and apply it separately (it is intentionally NOT in
# kustomization.yaml). The agent's ChatOpenAI reads these OpenAI-compatible vars,
# so point them at any OpenAI-spec endpoint (OpenAI cloud, a LiteLLM proxy, vLLM…).
#
#   oc create secret generic weather-llm-creds \
#     --from-literal=OPENAI_API_KEY=... \
#     --from-literal=OPENAI_BASE_URL=https://your-litellm-proxy.example.com/v1 \
#     --from-literal=MODEL_NAME=llama-scout-17b
apiVersion: v1
kind: Secret
metadata:
  name: weather-llm-creds
  labels:
    app.kubernetes.io/part-of: midojo-weather
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_ME"
  OPENAI_BASE_URL: "https://your-litellm-proxy.example.com/v1"
  MODEL_NAME: "llama-scout-17b"
