apiVersion: batch/v1
kind: Job
metadata:
  name: weather-run
  labels:
    app.kubernetes.io/part-of: midojo-weather
    app.kubernetes.io/component: orchestrator
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: midojo-weather
        app.kubernetes.io/component: orchestrator
    spec:
      restartPolicy: OnFailure
      containers:
        - name: orchestrator
          image: midojo
          # Wait for the control plane and the LangGraph agent to come up, then
          # run the full weather suite (all user x injection pairs) through the
          # langchain SDK. Add -ut/-it flags to scope the matrix down.
          command: ["sh", "-c"]
          args:
            - |
              python - <<'PY'
              import time, urllib.request
              for name, url in [
                  ("control plane", "http://weather-control-plane:8080/suite"),
                  ("agent", "http://weather-langchain-agent:8000/ok"),
              ]:
                  for _ in range(60):
                      try:
                          urllib.request.urlopen(url, timeout=3); print(f"{name} up"); break
                      except Exception:
                          print(f"waiting for {name}..."); time.sleep(5)
              PY
              midojo-run \
                --control-url http://weather-control-plane:8080 \
                --agent-url http://weather-langchain-agent:8000 \
                --protocol langgraph \
                --suite weather \
                --logdir /tmp/runs
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
