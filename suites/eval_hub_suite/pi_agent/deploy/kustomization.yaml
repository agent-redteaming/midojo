# Deploys the eval_hub_suite pi agent (system under test).
#
# The LLM-credentials Secret is intentionally NOT included here — create it
# separately (see eval-hub-contrib/adapters/midojo/README.md §1). Set the
# target namespace to your EvalHub CR namespace:
#
#   oc apply -k suites/eval_hub_suite/pi_agent/deploy -n $NS
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - agent.yaml
  - route.yaml
