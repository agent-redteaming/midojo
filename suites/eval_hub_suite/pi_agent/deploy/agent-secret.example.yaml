# LiteLLM credentials for the eval_hub_suite pi agent. DO NOT commit real
# values — copy this, fill it in, and apply it separately (it is intentionally
# NOT referenced by kustomization.yaml). Equivalent one-liner:
#
#   oc create secret generic eval-hub-suite-agent-llm-creds -n openshell \
#     --from-literal=LITELLM_API_KEY=... \
#     --from-literal=LITELLM_API_URL=https://your-maas-endpoint/v1 \
#     --from-literal=LITELLM_MODEL=your-model-id
apiVersion: v1
kind: Secret
metadata:
  name: eval-hub-suite-agent-llm-creds
  labels:
    app.kubernetes.io/part-of: eval-hub-midojo
type: Opaque
stringData:
  LITELLM_API_KEY: "REPLACE_ME"
  LITELLM_API_URL: "https://your-maas-endpoint/v1"
  LITELLM_MODEL: "your-model-id"
